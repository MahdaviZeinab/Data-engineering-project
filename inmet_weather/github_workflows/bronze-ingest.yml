# Batch run of the ingestion: download one year from INMET and load it
# into Bronze. Runs every day at 02:00 UTC and can also be started by hand.
#
# NOTE: a GitHub runner is thrown away after the job, so here the output is
# only kept as a downloadable artifact (the run report). When the cloud
# setup is ready, set DAT535_OUTPUT_DIR to the shared storage.
name: bronze-ingest

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      year:
        description: "Year to ingest"
        default: "2025"
      env:
        description: "dev or prod"
        default: "dev"

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Land raw files
        run: python bronze/injection.py --years ${{ github.event.inputs.year || '2025' }}
      - name: Bronze ingestion
        run: >
          python -m bronze.bronze_ingest
          --source data/raw
          --env ${{ github.event.inputs.env || 'dev' }}
          --years ${{ github.event.inputs.year || '2025' }}
      - name: Keep the run summary and file checks as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bronze-run-${{ github.run_id }}
          path: |
            data/lake/*/bronze/_runs/
            data/lake/*/bronze/inmet_files/
