# PROD pipeline on the OpenStack VM (self-hosted runner).
#
# When does it run?
#   - automatically after every push to main (= after a Pull Request is merged)
#   - by hand: Actions tab -> "Production Pipeline" -> Run workflow
#
# Every run WAITS for approval: GitHub Environment "main" has "Required reviewers".
# A reviewer opens the run and clicks "Review deployments" -> Approve.
#
# Writes ONLY to /data/inmet/lake/prod, with all years.
# Order: job "bronze" -> job "silver" (only if Bronze worked).
name: Production Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      years:
        description: "Year(s), separated by spaces, e.g. 2025 or 2020 2021 2022"
        default: "2020 2021 2022 2023 2024 2025"

# Only one prod run at a time (prod has its own Spark table list, metastore_db).
concurrency:
  group: inmet-prod
  cancel-in-progress: false

env:
  DATA_ROOT: /data/inmet
  LAKE_ENV: prod
  YEARS: ${{ inputs.years || '2020 2021 2022 2023 2024 2025' }}   # after a push: all years

jobs:
  bronze:
    runs-on: [self-hosted, linux, openstack]
    environment: main               # approval gate
    timeout-minutes: 240
    defaults:
      run:
        working-directory: inmet_weather
    steps:
      - uses: actions/checkout@v4

      - name: Check inputs, tools and data folders on the VM
        run: |
          # only digits and spaces are allowed in "years"
          if ! [[ "$YEARS" =~ ^[0-9]{4}( [0-9]{4})*$ ]]; then
            echo "Bad years input: '$YEARS' (use e.g. 2025 or 2020 2021)"; exit 1
          fi
          if ! mkdir -p "$DATA_ROOT/raw" "$DATA_ROOT/lake/$LAKE_ENV"; then
            echo "Cannot create $DATA_ROOT. Run once on the VM:"
            echo "  sudo mkdir -p $DATA_ROOT && sudo chown \$USER $DATA_ROOT"
            exit 1
          fi
          java -version
          python3 --version
          df -h "$DATA_ROOT"

      - name: Python environment (created once, then re-used)
        run: |
          if [ ! -x "$DATA_ROOT/venv/bin/python" ]; then
            python3 -m venv "$DATA_ROOT/venv"
          fi
          "$DATA_ROOT/venv/bin/pip" install --quiet --upgrade pip
          "$DATA_ROOT/venv/bin/pip" install --quiet -r requirements.txt
          echo "$DATA_ROOT/venv/bin" >> "$GITHUB_PATH"

      - name: Run the tests (stop here if the code is broken)
        run: python -m pytest -q

      - name: Point data/raw to the folder on the VM
        run: |
          mkdir -p data
          ln -sfn "$DATA_ROOT/raw" data/raw

      - name: Land raw files (download + unzip)
        run: python bronze/injection.py --years $YEARS

      - name: Bronze ingestion (Spark)
        env:
          DAT535_OUTPUT_DIR: ${{ env.DATA_ROOT }}/lake/${{ env.LAKE_ENV }}
        run: python -m bronze.bronze_ingest --source "$DATA_ROOT/raw" --env "$LAKE_ENV" --years $YEARS

      - name: Land fire files (download + unzip INPE fire foci)
        run: python bronze/injection.py --source fire --years $YEARS

      - name: Bronze fire ingestion (Spark)
        env:
          DAT535_OUTPUT_DIR: ${{ env.DATA_ROOT }}/lake/${{ env.LAKE_ENV }}
        run: python -m bronze.fire_ingest --source "$DATA_ROOT/raw" --env "$LAKE_ENV" --years $YEARS

      - name: Write Bronze summary
        if: always()                # also when a Bronze step failed (then Silver is skipped)
        run: |
          echo "## Production pipeline run: Bronze" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Run # | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | $LAKE_ENV |" >> $GITHUB_STEP_SUMMARY
          echo "| Years | $YEARS |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Result | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY

  silver:
    needs: bronze
    runs-on: [self-hosted, linux, openstack]
    environment: main
    timeout-minutes: 240
    defaults:
      run:
        working-directory: inmet_weather
    steps:
      - uses: actions/checkout@v4

      - name: Build Silver
        env:
          DAT535_OUTPUT_DIR: ${{ env.DATA_ROOT }}/lake/${{ env.LAKE_ENV }}
        run: $DATA_ROOT/venv/bin/python -m silver.silver_build --env "$LAKE_ENV" --years $YEARS

      - name: Build fire Silver
        env:
          DAT535_OUTPUT_DIR: ${{ env.DATA_ROOT }}/lake/${{ env.LAKE_ENV }}
        run: $DATA_ROOT/venv/bin/python -m silver.fire_build --env "$LAKE_ENV" --years $YEARS

      - name: Write run summary
        if: always()
        run: |
          echo "## Production pipeline run" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Run # | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | $LAKE_ENV |" >> $GITHUB_STEP_SUMMARY
          echo "| Years | $YEARS |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Result | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY