# Silver run on the OpenStack VM (self-hosted runner).
# 1. run the tests   2. if they pass, build Silver for the last 3 years (2023-2025).
#
# When does it run?
#   - automatically after every push (any branch)
#   - automatically after bronze-ingest finished successfully
#   - by hand: Actions tab -> silver -> Run workflow
name: silver

on:
  push:                               # every push, on any branch
  workflow_run:
    workflows: [bronze-ingest]
    types: [completed]
  workflow_dispatch:
    inputs:
      env:
        description: "Lake environment"
        type: choice
        options: [prod, dev]
        default: prod

jobs:
  silver:
    # after Bronze: only if Bronze succeeded (push and the button always run)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, openstack]
    env:
      DATA_ROOT: /data/inmet
      LAKE_ENV: ${{ inputs.env || 'prod' }}
    defaults:
      run:
        working-directory: inmet_weather
    steps:
      - uses: actions/checkout@v4

      # same Python environment that the Bronze workflow made on the VM
      - name: Run the tests
        run: $DATA_ROOT/venv/bin/python -m pytest -q

      - name: Build Silver (2023, 2024, 2025)
        env:
          DAT535_OUTPUT_DIR: ${{ env.DATA_ROOT }}/lake/${{ env.LAKE_ENV }}
        run: $DATA_ROOT/venv/bin/python -m silver.silver_build --env "$LAKE_ENV" --years 2023 2024 2025
