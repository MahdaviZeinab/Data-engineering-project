# Silver run on the OpenStack VM (self-hosted runner), ONLY by hand.
# 1. run the tests   2. if they pass, build Silver for 2024 and 2025.
#
# When does it run?
#   - by hand: Actions tab -> silver -> Run workflow
#   (After a push, Silver already runs as the second job of bronze-ingest.yml.)
name: silver

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Lake environment"
        type: choice
        options: [prod, dev]
        default: prod

# Never run two Spark jobs at the same time (same group as bronze-ingest.yml).
concurrency:
  group: inmet-spark
  cancel-in-progress: false

jobs:
  silver:
    runs-on: [self-hosted, linux, openstack]
    env:
      DATA_ROOT: /data/inmet
      LAKE_ENV: ${{ inputs.env || 'prod' }}
    defaults:
      run:
        working-directory: inmet_weather
    steps:
      - uses: actions/checkout@v4

      # same Python environment that the Bronze workflow made on the VM
      - name: Run the tests
        run: $DATA_ROOT/venv/bin/python -m pytest -q

      - name: Free memory on the VM (Spark needs it)
        run: |
          free -h
          ps aux | grep -i [j]ava || echo "no other Java/Spark running"

      - name: Build Silver (2024, 2025)
        env:
          DAT535_OUTPUT_DIR: ${{ env.DATA_ROOT }}/lake/${{ env.LAKE_ENV }}
        run: $DATA_ROOT/venv/bin/python -m silver.silver_build --env "$LAKE_ENV" --years 2024 2025
